<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITC 영어 학습 모니터 소개</title>
<style>
  :root { --brand:#00adef; --bg:#f2f8fc; --panel:#ffffff; --line:#dbe6ee; --text:#3b4046; --muted:#7b858f; --accent:#0089cf; --danger:#e5484d; --warn:#d98300; --ok:#55ab2c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e6f1f8; color: #3b4046; font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; }
  #page { max-width: 1160px; margin: 0 auto; padding: 20px 16px 28px; }
  #wrap { position: relative; width: 100%; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,90,140,.22); background: var(--bg); }
  #stage { position: absolute; left: 0; top: 0; width: 1120px; height: 630px; transform-origin: 0 0; color: var(--text); font-size: 13px; overflow: hidden; }
  .bar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); border-top: 4px solid; border-image: linear-gradient(90deg,#00adef 0 62%,#68bc45 62% 90%,#f9ab00 90%) 1; }
  .bar img { height: 26px; display: block; }
  .bar b { font-size: 13px; color: var(--muted); padding-left: 10px; border-left: 1px solid var(--line); } .bar span { color: var(--muted); margin-right: auto; margin-left: 6px; }
  .btn { font-style: normal; border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; background: var(--panel); white-space: nowrap; transition: .15s; }
  .btn.hit { border-color: var(--accent); background: #d9f1fc; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; height: 586px; }
  .tile { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .3s, box-shadow .3s, opacity .4s; }
  .tile.off { opacity: .45; }
  .tile.bad { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(242,100,100,.28); }
  .th { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); transition: .3s; }
  .tile:not(.off) .dot { background: var(--ok); }
  .th b { font-size: 13px; } .badges { margin-left: auto; display: flex; gap: 5px; }
  .badge { font-size: 11px; padding: 0 7px; border-radius: 99px; border: 1px solid currentColor; animation: pop .3s; }
  .red { color: var(--danger); } .amber { color: var(--warn); } .blue { color: var(--accent); } .gray { color: var(--muted); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .scr { flex: 1; background: #0e1620; position: relative; overflow: hidden; }
  .tf { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  .tf span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12px; }
  .tf .btn { font-size: 11px; padding: 2px 8px; }

  /* 가짜 학생 화면 */
  .view { position: absolute; inset: 0; animation: fade .35s; }
  @keyframes fade { from { opacity: 0; } }
  .v-study { background: #dfe3ea; padding: 5% 9% 0; }
  .v-study .paper { background: #fff; height: 100%; border-radius: 4px 4px 0 0; padding: 6% 8%; color: #222; }
  .v-study h4 { margin: 0 0 6%; font-size: 1.05em; }
  .ln { height: 5px; border-radius: 3px; background: #c9ced8; margin-bottom: 4.2%; transition: width .5s; }
  .ln.new { background: #7da2ff; }
  .v-video { background: #101623; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6%; }
  .v-video .box { width: 62%; aspect-ratio: 16/9; background: linear-gradient(135deg,#24406e,#3b6bb5); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; }
  .v-video .pbar { width: 62%; height: 4px; background: #33415c; border-radius: 2px; } .v-video .pbar i { display: block; height: 100%; background: #7da2ff; border-radius: 2px; transition: width 1s linear; }
  .v-yt { background: #121212; display: grid; grid-template-columns: 2.2fr 1fr; gap: 4%; padding: 5%; }
  .v-yt .main { background: linear-gradient(135deg,#5a1616,#b02a2a); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .v-yt .play { width: 0; height: 0; border: 14px solid transparent; border-left: 24px solid #fff; margin-left: 12px; }
  .v-yt .side { display: flex; flex-direction: column; gap: 8%; } .v-yt .side i { flex: 1; background: #2b2b2b; border-radius: 4px; }
  .v-yt .logo { position: absolute; left: 5%; top: 3%; color: #ff4e45; font-weight: 800; font-size: .8em; }
  .v-lock { background: #0089cf; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; font-weight: 700; padding: 8%; }
  .v-none { display: flex; align-items: center; justify-content: center; color: #5d6472; }

  /* 겹쳐 뜨는 요소 */
  .ov { position: absolute; opacity: 0; pointer-events: none; transition: opacity .4s, transform .4s; }
  .ov.on { opacity: 1; }
  #dim { inset: 0; background: rgba(20,45,65,.45); }
  #pip { right: 26px; bottom: 26px; width: 430px; background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--brand); border-radius: 12px; padding: 10px; box-shadow: 0 16px 40px rgba(0,60,100,.35); transform: translateY(30px); }
  #pip.on { transform: none; }
  #pip h5 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 500; }
  #pipScr { position: relative; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; background: #0b0d12; font-size: 15px; }
  #toast { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.7); width: 66%; background: #fff; color: #111; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.5); opacity: 0; transition: .3s; overflow: hidden; text-align: center; font-size: 12px; }
  #toast.on { opacity: 1; transform: translate(-50%,-50%); }
  #toast small { display: block; text-align: left; background: #eef4f8; padding: 4px 10px; color: #555; }
  #toast p { margin: 16px 10px; font-weight: 700; font-size: 15px; } #toast em { display: block; font-style: normal; background: #0089cf; color: #fff; padding: 6px; }
  #tray { position: absolute; right: 8px; bottom: 8px; background: #263043; color: #dfe6f5; font-size: 10.5px; padding: 5px 9px; border-radius: 6px; opacity: 0; transition: .4s; }
  #tray.on { opacity: 1; }
  #dlg { left: 50%; top: 46%; width: 420px; transform: translate(-50%,-46%) scale(.95); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: 0 16px 50px rgba(0,60,100,.35); }
  #dlg.on { transform: translate(-50%,-50%); }
  #dlg h5 { margin: 0 0 10px; font-size: 14px; }
  #dlgText { min-height: 64px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  #dlgText::after { content: "|"; color: var(--accent); animation: blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity: 0; } }
  #dlg .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .btn.pri { background: #0089cf; border-color: #0089cf; color: #fff; }
  #hist { left: 60px; top: 60px; width: 1000px; height: 510px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: 0 16px 50px rgba(0,60,100,.35); transform: scale(.97); }
  #hist.on { transform: none; }
  #hist h5 { margin: 0 0 12px; font-size: 14px; }
  #hist .cols { display: grid; grid-template-columns: 330px 1fr; gap: 14px; height: 440px; }
  #hist .cols > div { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lr { padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 12px; opacity: 0; transform: translateX(-8px); transition: .3s; }
  .lr.on { opacity: 1; transform: none; } .lr time { color: var(--muted); margin-right: 8px; } .lr.d { color: var(--danger); } .lr.s { color: var(--accent); }
  #shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; align-content: start; }
  .shot { border: 2px solid var(--line); border-radius: 7px; overflow: hidden; opacity: 0; transition: .3s; font-size: 7px; }
  .shot.on { opacity: 1; } .shot.d { border-color: var(--danger); }
  .shot > div:first-child { position: relative; aspect-ratio: 16/9; } .shot > div:last-child { font-size: 11px; padding: 3px 8px; background: #f2f8fc; }
  #dual { inset: 0; background: #e6f3fa; display: flex; align-items: center; justify-content: center; gap: 46px; }
  .dev { text-align: center; transform: translateY(20px); opacity: 0; transition: .5s; } #dual.on .dev { transform: none; opacity: 1; } #dual.on .dev + .link + .dev { transition-delay: .5s; }
  .dev .frame { width: 440px; height: 248px; border: 8px solid #4d4d4d; border-radius: 12px; overflow: hidden; background: var(--bg); position: relative; }
  .dev .frame > div { position: absolute; left: 0; top: 0; width: 1120px; height: 630px; transform: scale(.3786); transform-origin: 0 0; }
  .dev .base { width: 500px; height: 10px; background: #4d4d4d; border-radius: 0 0 12px 12px; margin: 0 -30px; }
  .dev p { margin: 14px 0 0; font-size: 15px; font-weight: 600; } .dev small { color: var(--muted); font-size: 12px; }
  .link { color: var(--accent); font-size: 12px; text-align: center; } .link i { display: block; width: 46px; height: 2px; background: var(--accent); margin: 6px auto; }
  #card { inset: 0; background: radial-gradient(circle at 10% 112%, #f9ab00 0 15%, transparent 15.2%), radial-gradient(circle at -4% 104%, #68bc45 0 34%, transparent 34.2%), radial-gradient(circle at 104% -8%, #00adef 0 30%, transparent 30.2%), #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
  #card img { height: 120px; } #card h2 { font-size: 34px; margin: 6px 0 0; letter-spacing: -1px; color: #4d4d4d; } #card p { font-size: 19px; color: #7b858f; margin: 0; }
  #card ul { list-style: none; padding: 0; margin: 12px 0 0; display: flex; gap: 12px; } #card li { border: 1.5px solid #00adef; border-radius: 99px; padding: 6px 16px; font-size: 14px; color: #3b4046; background: #fff; }
  #cursor { position: absolute; left: 560px; top: 700px; width: 20px; height: 20px; z-index: 50; transition: left .7s cubic-bezier(.3,.7,.3,1), top .7s cubic-bezier(.3,.7,.3,1), opacity .3s; pointer-events: none; }
  #cursor svg { display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  #cursor.click::after { content: ""; position: absolute; left: -12px; top: -12px; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; animation: ring .45s; opacity: 0; }
  @keyframes ring { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }
  #tag { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #7b858f; background: rgba(255,255,255,.85); padding: 2px 8px; border-radius: 6px; z-index: 60; }

  #caption { min-height: 76px; margin-top: 16px; text-align: center; }
  #caption b { display: block; font-size: 21px; color: #2f3439; } #caption span { color: #5d6770; }
  #ctl { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  #prog { flex: 1; height: 5px; background: #c8dbe7; border-radius: 3px; overflow: hidden; } #prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#00adef,#68bc45); transition: width .4s; }
  #ctl button { font: inherit; border: 1px solid #c3c8d2; background: #fff; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="page">
  <div id="wrap"><div id="stage">
    <div class="bar"><img data-logo alt="ITC 영어"><b>학습 모니터</b><span id="sum"></span>
      <i class="btn" id="bMsgAll">전체 메시지</i><i class="btn" id="bLockAll">전체 잠금</i><i class="btn" id="bUnlockAll">전체 해제</i><i class="btn">설정</i></div>
    <div class="grid" id="grid"></div>

    <div class="ov" id="dim"></div>
    <div class="ov" id="dlg"><h5 id="dlgTitle"></h5><div id="dlgText"></div>
      <div class="row"><i class="btn">취소</i><i class="btn pri" id="dlgSend">보내기</i></div></div>
    <div class="ov" id="hist"><h5>지우 기록 · 오늘</h5><div class="cols"><div id="logs"></div><div id="shots"></div></div></div>
    <div class="ov" id="pip"><h5 id="pipTitle"></h5><div id="pipScr"><div id="pipView"></div>
      <div id="toast"><small>ITC 영어 - 선생님 메시지</small><p id="toastText"></p><em>확인</em></div><div id="tray"></div></div></div>
    <div class="ov" id="dual">
      <div class="dev"><div class="frame"><div id="devA"></div></div><div class="base"></div><p>Windows 노트북</p><small>서버를 켠 컴퓨터</small></div>
      <div class="link">같은 와이파이<i></i>비밀번호 로그인</div>
      <div class="dev"><div class="frame"><div id="devB"></div></div><div class="base"></div><p>Mac</p><small>브라우저로 접속</small></div>
    </div>
    <div class="ov" id="card"></div>
    <div id="cursor"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 2l13 7-6 1.5L7.5 17z" fill="#fff" stroke="#111" stroke-width="1.2"/></svg></div>
    <div id="tag">시뮬레이션 · 실제 학생 화면이 아닙니다</div>
  </div></div>
  <div id="caption"><b id="capT"></b><span id="capS"></span></div>
  <div id="ctl"><button id="pause">일시정지</button><div id="prog"><i></i></div><button id="replay">처음부터</button></div>
</div>

const S = [

let run = 0, paused = false, pipIdx = -1;
const sleep = (ms) => { const me = run; return new Promise((res, rej) => { let left = ms; const t = setInterval(() => {

function cap(t, s) { $('capT').textContent = t; $('capS').textContent = s || ''; }

  await sleep(2200); show('pip', false); pipIdx = -1; next();

  // 6. 자리비움
  cap('자리를 비운 학생도 알 수 있습니다', '5분 이상 키보드와 마우스 입력이 없으면 표시합니다.');
  await sleep(900); st[3].away = 5; draw(3); await sleep(1500); st[3].away = 6; draw(3);
  await sleep(1800); st[3].away = 0; draw(3); next();

  // 7. 잠금
  cap('설명할 때는 화면을 한꺼번에 잠급니다', '잠긴 동안 학생은 키보드를 쓸 수 없습니다. 선생님 컴퓨터와 1분 이상 끊기면 자동으로 풀립니다.');
  await click('bLockAll');
  st.forEach((s, i) => { s.lock = '잠시 화면이 잠겼습니다.<br>선생님을 봐 주세요.'; draw(i); });
  cur(900, 320, 0); pip(0, '민수 PC 화면'); await sleep(3600);
  show('pip', false); pipIdx = -1; await sleep(300);
  await click('bUnlockAll'); st.forEach((s, i) => { s.lock = false; draw(i); }); cur(900, 320, 0);
  await sleep(1300); next();

  // 8. 기록
  cap('수업이 끝난 뒤에도 기록으로 확인합니다', '30초마다, 그리고 딴짓이 감지된 순간 스크린샷을 저장합니다. 14일 뒤 자동 삭제됩니다.');
  await click('h1'); show('dim'); show('hist'); cur(900, 600, 0);
  const logs = [['16:02:10', '영어 독해 연습.hwp - 한글', ''], ['16:14:37', '게임 하이라이트 모음 - YouTube', 'd'], ['16:14:52', '메시지 전송: 집중해서 공부합시다.', 's'],
    ['16:15:03', '영어 독해 연습.hwp - 한글', ''], ['16:21:40', '화면 잠금', 's'], ['16:22:05', '잠금 해제', 's']];
  $('logs').innerHTML = logs.map((l) => `<div class="lr ${l[2]}"><time>${l[0]}</time>${l[1]}</div>`).join('');
  const shots = [['16:13:30', views.study('영어 독해 연습', 4), ''], ['16:14:37 · 딴짓 감지', views.yt(), 'd'], ['16:15:30', views.study('영어 독해 연습', 5), ''],
    ['16:16:00', views.study('영어 독해 연습', 6), ''], ['16:21:40', views.lock('잠김'), ''], ['16:22:30', views.study('영어 독해 연습', 7), '']];
  $('shots').innerHTML = shots.map((s) => `<div class="shot ${s[2]}"><div>${s[1]}</div><div>${s[0]}</div></div>`).join('');
  const lr = [...document.querySelectorAll('.lr')], sh = [...document.querySelectorAll('.shot')];
  for (let i = 0; i < 6; i++) { await sleep(380); lr[i].classList.add('on'); sh[i].classList.add('on'); }
  await sleep(2600); show('hist', false); show('dim', false); next();

  // 9. 두 대에서 동시에
  cap('Windows와 Mac에서 동시에 볼 수 있습니다', '한 대가 서버를 켜고, 다른 한 대는 브라우저에서 비밀번호로 접속합니다.');
  const snap = `<div class="bar">${document.querySelector('.bar').innerHTML}</div><div class="grid">${$('grid').innerHTML.replace(/ id="[^"]*"/g, '')}</div>`;
  $('devA').innerHTML = snap; $('devB').innerHTML = snap; show('dual');
  await sleep(4800); next();

  // 10. 마무리
  card(LOGO_IMG + '<h2>학습 모니터</h2><p>공부하는 시간을 지키는 가장 간단한 방법</p><ul><li>같은 와이파이 안에서만 동작</li><li>외부 서버로 전송 없음</li><li>학생에게 공유 사실 표시</li></ul>');
  show('dual', false);
  cap('준비는 두 단계입니다', '선생님 컴퓨터에서 start 파일 실행 → 학생 PC에 student 폴더를 복사해 install.bat 실행');
  next();
}
function start() { run++; paused = false; $('pause').textContent = '일시정지'; play().catch(() => {}); }
$('replay').onclick = start;
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? '계속 재생' : '일시정지'; };
start();
</script>
</body>
</html>
